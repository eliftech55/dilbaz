<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Dilbaz - Telaffuz ve Diksiyon Oyunları</title>
    <meta name="description" content="Arkadaşlarınla canlı odalarda hız ve telaffuz doğruluğunda yarıştığın diksiyon ve tekerleme platformu." />
    <meta property="og:title" content="Dilbaz - Telaffuz ve Diksiyon Oyunları" />
    <meta property="og:description" content="Arkadaşlarınla canlı odalarda hız ve telaffuz doğruluğunda yarıştığın diksiyon ve tekerleme platformu." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0d1629" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dilbaz" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        var reloadedKey = 'dilbaz_chunk_reloaded';
        function clearCachesAndReload() {
          try {
            var tasks = [];
            if ('caches' in window) {
              tasks.push(
                window.caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return window.caches.delete(k); }));
                })
              );
            }
            if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
              tasks.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                })
              );
            }
            Promise.all(tasks).finally(function () { window.location.reload(); });
          } catch (e) {
            window.location.reload();
          }
        }
        window.__dilbazHardReload = clearCachesAndReload;

        function tryRecoverChunk() {
          try {
            if (window.sessionStorage && window.sessionStorage.getItem(reloadedKey)) {
              var fallbackEl = document.getElementById('dilbaz-boot-fallback');
              if (fallbackEl) fallbackEl.style.display = 'flex';
              return;
            }
            if (window.sessionStorage) window.sessionStorage.setItem(reloadedKey, '1');
            clearCachesAndReload();
          } catch (e) {
            // ignore
          }
        }

        window.addEventListener('vite:preloadError', function (event) {
          if (event && typeof event.preventDefault === 'function') event.preventDefault();
          tryRecoverChunk();
        });
        window.addEventListener('error', function (e) {
          var target = e && e.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            tryRecoverChunk();
          }
        }, true);

        // Mobile boot watchdog: if React fails to mount within 10s, reveal recovery controls
        window.setTimeout(function () {
          var splash = document.getElementById('dilbaz-boot-splash');
          var fallbackEl = document.getElementById('dilbaz-boot-fallback');
          if (splash && fallbackEl) {
            fallbackEl.style.display = 'flex';
          }
        }, 10000);
      })();
    </script>
  </head>
  <body class="min-h-[100dvh] bg-[#0d1629] text-[#F8FAFC] antialiased selection:bg-[#FFBE0B] selection:text-[#14213D]">
    <div id="root" class="min-h-[100dvh] bg-[#0d1629]">
      <div
        id="dilbaz-boot-splash"
        style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(circle at top left,#1d2d50 0%,#090e1a 100%);color:#f8fafc;font-family:Poppins,-apple-system,BlinkMacSystemFont,sans-serif;"
      >
        <img
          src="/pwa-192x192.png"
          alt="Dilbaz"
          width="72"
          height="72"
          style="border-radius:9999px;border:2px solid rgba(255,190,11,0.7);box-shadow:0 0 28px rgba(255,190,11,0.28);margin-bottom:14px;"
        />
        <div style="font-family:Fredoka,sans-serif;font-size:22px;font-weight:700;letter-spacing:0.08em;color:#FFBE0B;margin-bottom:6px;">
          DİLBAZ
        </div>
        <div style="font-size:12px;color:#93C5FD;">
          Uygulama hazırlanıyor...
        </div>
        <div
          id="dilbaz-boot-fallback"
          style="display:none;flex-direction:column;gap:10px;margin-top:20px;max-width:300px;width:100%;"
        >
          <div style="font-size:12px;color:#CBD5E1;line-height:1.5;">
            Yükleme beklenenden uzun sürdü. Önbelleği temizleyip yeniden deneyebilirsiniz.
          </div>
          <button
            type="button"
            onclick="window.__dilbazHardReload ? window.__dilbazHardReload() : window.location.reload()"
            style="border:0;border-radius:14px;padding:11px 16px;font-weight:700;font-size:13px;background:linear-gradient(135deg,#FF006E,#FFBE0B);color:#fff;cursor:pointer;"
          >
            Önbelleği Temizle ve Aç
          </button>
        </div>
      </div>
    </div>
    <noscript>
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1629;color:#F8FAFC;font-family:sans-serif;padding:24px;text-align:center;">
        Dilbaz uygulamasını çalıştırmak için lütfen tarayıcınızda JavaScript'i etkinleştirin.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
